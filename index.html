<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DerTriti</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f3f4f6;
      color: #111827;
    }

    .navbar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 64px;
      background: #0f172a;
      display: flex;
      align-items: center;
      padding: 0 24px;
      gap: 16px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.35);
      z-index: 1000;
    }

    .nav-btn {
      text-decoration: none;
      color: #ffffff;
      font-size: 17px;
      font-weight: 600;
      padding: 10px 22px;
      border-radius: 10px;
      background: linear-gradient(135deg, #4f46e5, #3b82f6);
      transition: all 0.25s ease;
      white-space: nowrap;
    }

    .nav-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(0,0,0,0.35);
    }

    .content {
      padding-top: 110px;
      text-align: center;
    }
  </style>
</head>

<body>

  <div class="navbar">
    <a class="nav-btn" href="https://dertriti.github.io/">Home</a>
    <a class="nav-btn" href="https://dertriti.github.io/about">About</a>
    <a class="nav-btn" href="https://dertriti.github.io/countdown.new">Countdown</a>
  </div>

  <div class="content">
    <h1>Welcome to DerTriti</h1>
    <p>This website hosts my projects and experiments.</p>
  </div>

</body>
</html>
